<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pegawaiku - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<style>
  :root{--bg:#f7f6f2;--surface:#fbfbf9;--surface2:#f1efe9;--border:#d4d1ca;--text:#28251d;--muted:#6f6d67;--primary:#01696f;--success:#437a22;--warn:#964219;--danger:#a13544;--radius:14px;--radius-lg:18px;--shadow:0 10px 24px rgba(20,20,20,.08)}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .sidebar{padding:24px;background:var(--surface);border-right:1px solid var(--border)}
  .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
  .brand svg{width:38px;height:38px;color:var(--primary)}
  .brand h1{margin:0;font-size:1.25rem}
  .brand p{margin:0;color:var(--muted);font-size:.8rem}
  .nav a{display:block;padding:12px 14px;border-radius:var(--radius);text-decoration:none;color:var(--text);margin-bottom:6px;border:1px solid transparent;font-size:.95rem}
  .nav a.active,.nav a:hover{background:var(--surface2);border-color:var(--border)}
  .main{padding:24px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .top h2{margin:0;font-size:1.6rem}
  .top p{margin:6px 0 0;color:var(--muted)}
  .btn{padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:20px}
  .cols2{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  .cols4{grid-template-columns:repeat(4,1fr)}
  .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .value{font-size:1.8rem;font-weight:700;margin-top:6px}
  .status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
  .ok{background:#e8f1e3;color:var(--success)}.wait{background:#f5ebe3;color:var(--warn)}.bad{background:#f7e7ea;color:var(--danger)}.info{background:#ebf3f3;color:var(--primary)}
  .table{width:100%;border-collapse:collapse;margin-top:12px}
  .table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:.92rem;vertical-align:top}
  .table th{color:var(--muted)}
  .field{display:grid;gap:8px;margin-bottom:14px}
  .field input,.field select,.field textarea{padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;font:inherit}
  .progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:8px}
  .progress span{display:block;height:100%;background:var(--primary);border-radius:999px}
  .muted{color:var(--muted)}
  .item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:0;padding-bottom:0}
  .kpi{background:var(--surface2);border-radius:var(--radius);padding:16px}
  .hero{padding:60px 24px;text-align:center;background:var(--surface);border-bottom:1px solid var(--border)}
  .hero h1{margin:0;font-size:2rem}
  .hero p{margin:12px 0 0;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:40px auto;padding:0 24px}
  .role-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;text-align:center;box-shadow:var(--shadow)}
  .role-card h3{margin:12px 0 6px}
  .role-card p{color:var(--muted);font-size:.92rem}
  .login-box{max-width:420px;margin:60px auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
  .login-box h2{margin-top:0}
  .btn-block{width:100%;margin-top:8px}
  .note{font-size:.9rem;color:var(--muted)}
  @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.cols2,.cols3,.cols4,.cards{grid-template-columns:1fr}}
</style>

</head>
<body>
  <div class="login-box">
    <div style="text-align:center;margin-bottom:20px">
      <svg viewBox="0 0 64 64" fill="none" style="width:48px;height:48px;color:var(--primary)"><rect x="8" y="10" width="20" height="44" rx="8" stroke="currentColor" stroke-width="4"/><rect x="36" y="10" width="20" height="28" rx="8" stroke="currentColor" stroke-width="4"/></svg>
      <h2 style="margin:12px 0 0">Pegawaiku</h2>
      <p class="muted">Login sebagai Admin atau Pegawai</p>
    </div>
    <div class="field"><label>Email / NIP</label><input value="admin@kursus.go.id"/></div>
    <div class="field"><label>Kata sandi</label><input type="password" value="********"/></div>
    <div class="field"><label>Masuk sebagai</label>
      <select>
        <option>Admin SDM</option>
        <option>Pegawai</option>
        <option>Pimpinan</option>
      </select>
    </div>
    <a href="./admin-dashboard.html" class="btn btn-primary btn-block" style="text-decoration:none;display:inline-block;text-align:center">Masuk</a>
    <p class="note" style="text-align:center;margin-top:16px">Demo: klik Masuk untuk masuk sebagai Admin.</p>
  </div>
</body>
</html>
