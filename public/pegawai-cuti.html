<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pegawaiku - Pengajuan Cuti</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<style>
  :root{--bg:#f7f6f2;--surface:#fbfbf9;--surface2:#f1efe9;--border:#d4d1ca;--text:#28251d;--muted:#6f6d67;--primary:#01696f;--success:#437a22;--warn:#964219;--danger:#a13544;--radius:14px;--radius-lg:16px;--shadow:0 2px 8px rgba(0,0,0,0.08)}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .sidebar{padding:24px;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
  .brand svg{width:38px;height:38px;color:var(--primary)}
  .brand h1{margin:0;font-size:1.25rem}
  .brand p{margin:0;color:var(--muted);font-size:.8rem}
  .nav a{display:block;padding:12px 14px;border-radius:var(--radius);text-decoration:none;color:var(--text);margin-bottom:6px;border:1px solid transparent;font-size:.95rem;transition:all 0.2s}
  .nav a.active,.nav a:hover{background:var(--surface2);border-color:var(--border)}
  .main{padding:24px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .top h2{margin:0;font-size:1.6rem}
  .top p{margin:6px 0 0;color:var(--muted)}
  .btn{padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;transition:all 0.2s;font-size:.95rem}
  .btn:hover{background:var(--surface2);border-color:var(--border)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:#014e55;border-color:#014e55}
  .btn-secondary{background:var(--surface2);color:var(--text);border-color:var(--border)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:20px}
  .cols2{grid-template-columns:1fr 1fr}
  .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .value{font-size:1.8rem;font-weight:700;margin-top:6px}
  .status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
  .ok{background:#e8f1e3;color:var(--success)}.wait{background:#f5ebe3;color:var(--warn)}.bad{background:#f7e7ea;color:var(--danger)}.info{background:#ebf3f3;color:var(--primary)}
  .field{display:grid;gap:8px;margin-bottom:14px}
  .field label{font-weight:500;font-size:.9rem}
  .field input,.field select,.field textarea{padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;font:inherit;color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(1,105,111,0.1)}
  .field textarea{min-height:100px;resize:vertical}
  .muted{color:var(--muted)}
  .info-box{background:#ebf3f3;border:1px solid #d6e7e9;border-radius:var(--radius);padding:16px;margin-bottom:20px;color:var(--primary);font-size:.92rem}
  .info-box strong{display:block;margin-bottom:6px}
  .form-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  
  .alert{padding:12px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:.92rem}
  .alert-success{background:#e8f1e3;color:var(--success);border:1px solid #d1e6c4}
  .alert-danger{background:#f7e7ea;color:var(--danger);border:1px solid #f0d4da}
  .alert-warn{background:#f5ebe3;color:var(--warn);border:1px solid #f0e4d4}
  
  @media(max-width:980px){
    .app{grid-template-columns:1fr}
    .sidebar{border-right:0;border-bottom:1px solid var(--border);position:relative;height:auto}
    .cols2{grid-template-columns:1fr}
  }
</style>

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 64 64" fill="none"><rect x="8" y="10" width="20" height="44" rx="8" stroke="currentColor" stroke-width="4"/><rect x="36" y="10" width="20" height="28" rx="8" stroke="currentColor" stroke-width="4"/></svg>
        <div><h1>Pegawaiku</h1><p id="userRole">Pegawai</p></div>
      </div>
      <nav class="nav">
        <a href="./pegawai-dashboard.html">Dashboard</a>
        <a href="./pegawai-cuti.html" class="active">Pengajuan Cuti</a>
        <a href="./pegawai-program.html">Program</a>
      </nav>
    </aside>
    
    <main class="main">
      <div class="top">
        <div>
          <h2>Pengajuan Cuti / Izin</h2>
          <p>Ajukan cuti atau izin Anda di sini</p>
        </div>
        <button class="btn" onclick="logout()">Logout</button>
      </div>

      <div id="alertContainer"></div>

      <div class="grid cols2">
        <div class="card">
          <h3 style="margin-top:0">Saldo Cuti Anda</h3>
          <div class="field">
            <label>Cuti Tahunan</label>
            <div class="value" id="annualLeave" style="font-size:1.5rem">-</div>
          </div>
          <div class="field">
            <label>Cuti Terpakai</label>
            <div class="value" id="usedLeave" style="font-size:1.5rem">-</div>
          </div>
          <div class="field">
            <label>Sisa Cuti</label>
            <div class="value" id="remainingLeave" style="font-size:1.5rem;color:var(--primary)">-</div>
          </div>
          <div class="info-box" style="margin-top:20px;background:#f5ebe3;color:var(--warn);border-color:#f0e4d4">
            <strong>⚠️ Penting:</strong>
            Pengajuan cuti akan otomatis ditolak jika melebihi sisa cuti Anda.
          </div>
        </div>

        <div class="card">
          <h3 style="margin-top:0">Ajukan Cuti Baru</h3>
          <form id="leaveForm" onsubmit="submitLeaveRequest(event)">
            <div class="field">
              <label for="leaveType">Tipe Pengajuan *</label>
              <select id="leaveType" required>
                <option value="">-- Pilih --</option>
                <option value="cuti">Cuti</option>
                <option value="izin">Izin</option>
              </select>
            </div>

            <div class="field">
              <label for="startDate">Tanggal Mulai (hari kerja) *</label>
              <input type="date" id="startDate" required>
            </div>

            <div class="field">
              <label for="endDate">Tanggal Akhir (hari kerja) *</label>
              <input type="date" id="endDate" required>
            </div>

            <div class="field">
              <label>Perkiraan Hari Kerja</label>
              <div style="padding:12px 14px;background:var(--surface2);border-radius:12px;border:1px solid var(--border);font-weight:600;color:var(--primary)" id="estimatedDays">-</div>
            </div>

            <div class="field">
              <label for="reason">Alasan / Keterangan *</label>
              <textarea id="reason" placeholder="Jelaskan alasan pengajuan cuti/izin Anda" required></textarea>
            </div>

            <div class="form-footer">
              <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
              <button type="submit" class="btn btn-primary">Ajukan</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('load', async () => {
      await checkAuth();
      await loadLeaveBalance();
      
      // Auto calculate work days
      document.getElementById('startDate').addEventListener('change', calculateWorkDays);
      document.getElementById('endDate').addEventListener('change', calculateWorkDays);
    });

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          window.location.href = '/login.html';
          return;
        }
        const data = await response.json();
        if (data.user.role !== 'pegawai' && data.user.role !== 'pimpinan') {
          alert('Halaman ini hanya untuk pegawai');
          window.location.href = '/';
        }
      } catch (error) {
        window.location.href = '/login.html';
      }
    }

    async function loadLeaveBalance() {
      try {
        const response = await fetch('/api/leaves/balance');
        if (!response.ok) throw new Error('Gagal memuat saldo cuti');
        
        const data = await response.json();
        const balance = data.balance;

        if (balance) {
          document.getElementById('annualLeave').textContent = balance.annualLeave + ' hari';
          document.getElementById('usedLeave').textContent = balance.usedLeave + ' hari';
          document.getElementById('remainingLeave').textContent = balance.remainingLeave + ' hari';
        }
      } catch (error) {
        showAlert(error.message, 'danger');
      }
    }

    function calculateWorkDays() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      if (!startDate || !endDate) {
        document.getElementById('estimatedDays').textContent = '-';
        return;
      }

      const start = new Date(startDate);
      const end = new Date(endDate);

      if (start > end) {
        document.getElementById('estimatedDays').textContent = 'Tanggal tidak valid';
        return;
      }

      let workDays = 0;
      for (let date = new Date(start); date <= end; date.setDate(date.getDate() + 1)) {
        const dayOfWeek = date.getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 6) {
          workDays++;
        }
      }

      document.getElementById('estimatedDays').textContent = workDays + ' hari kerja';
    }

    async function submitLeaveRequest(event) {
      event.preventDefault();

      const formData = {
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        type: document.getElementById('leaveType').value,
        reason: document.getElementById('reason').value
      };

      try {
        const button = event.target.querySelector('button[type="submit"]');
        button.disabled = true;
        button.innerHTML = '<span class="spinner"></span> Mengirim...';

        const response = await fetch('/api/leaves/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
          // Jika ditolak otomatis
          if (data.rejected) {
            showAlert(data.error, 'danger');
          } else {
            throw new Error(data.error);
          }
        } else {
          showAlert(data.message, 'success');
          resetForm();
          await loadLeaveBalance();
        }
      } catch (error) {
        showAlert(error.message, 'danger');
      } finally {
        const button = event.target.querySelector('button[type="submit"]');
        button.disabled = false;
        button.innerHTML = 'Ajukan';
      }
    }

    function resetForm() {
      document.getElementById('leaveForm').reset();
      document.getElementById('estimatedDays').textContent = '-';
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login.html';
      } catch (error) {
        console.error(error);
      }
    }

    function showAlert(message, type = 'info') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 5000);
    }
  </script>
</body>
</html>
